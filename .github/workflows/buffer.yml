name: buffer-fill
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 cloud/buffer_fill.py cloud/schedule.json cloud/media.json
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
